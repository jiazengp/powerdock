[package]
name = "powerdock"
version = "0.3.0-preview.4"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
description = "Native high-performance, low-footprint Windows battery monitoring and alerts for multi-brand peripherals"
repository = "https://github.com/jiazengp/powerdock"
build = "build.rs"

[dependencies]
base64 = "0.23.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
windows-sys = { version = "0.61.2", features = [
 "Win32_Foundation", "Win32_Devices_Properties", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice",
 "Win32_Devices_Bluetooth", "Win32_Networking_WinSock", "Win32_Networking_WinHttp", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem",
 "Win32_Security", "Win32_System_IO", "Win32_System_Threading", "Win32_System_LibraryLoader",
 "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_Diagnostics_Debug", "Win32_Globalization", "Win32_UI_Shell",
 "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"
] }
windows = { version = "0.62.2", features = [
 "Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Devices_HumanInterfaceDevice", "Storage", "Storage_Streams", "Devices_Enumeration", "Gaming_Input", "Devices_Power", "System_Power", "Win32_UI_Input_XboxController", "Data_Xml_Dom", "UI_Notifications", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
 "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage"
] }
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }

windows-collections = "0.3.2"
windows-future = "0.3.2"
velopack = { version = "=1.3.39-g8d2844f", features = ["public-utils"] }
semver = "1.0"
sha2 = "0.11"
rust-i18n = "=4.2.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
tracing-appender = "0.2"
regex = "1"
zip = { version = "=9.8.2", default-features = false, features = ["deflate"] }

# Protocol-only reuse; Windows transport and battery policy remain local.
sennheiser-protocol = { package = "protocol", path = "vendor/sennheiser-protocol" }
hidpp = { package = "openlogi-hidpp", version = "=0.9.0", default-features = false }
openlogi-device-registry = "=0.9.0"
futures = "=0.3.34"
async-channel = "=2.5.0"
futures-timer = "=3.0.4"

[dev-dependencies]
windows = { version = "0.62.2", features = ["Data_Json"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Pipes"] }

[build-dependencies]
serde_json = "1.0.150"
winresource = { version = "=0.1.34", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
