version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      rust-dependencies:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /ui
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      native-ui-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
