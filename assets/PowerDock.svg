<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <title>PowerDock</title>
  <desc>A graphite battery with a silver rim and three silver charge cells, on a transparent background.</desc>
  <defs>
    <linearGradient id="rim" x1="8" y1="11" x2="37" y2="37" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8B8B8"/>
      <stop offset="1" stop-color="#757575"/>
    </linearGradient>
    <linearGradient id="shell" x1="10" y1="12" x2="33" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#505050"/>
      <stop offset="1" stop-color="#303030"/>
    </linearGradient>
    <linearGradient id="cells" x1="12" y1="16" x2="30" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2F2F2"/>
      <stop offset="1" stop-color="#C9C9C9"/>
    </linearGradient>
  </defs>
  <rect x="38" y="19" width="7" height="10" rx="3" fill="url(#rim)"/>
  <rect x="3" y="11" width="37" height="26" rx="6" fill="url(#rim)"/>
  <rect x="4" y="12" width="35" height="24" rx="5" fill="url(#shell)"/>
  <rect x="7" y="15" width="29" height="18" rx="3" fill="#252525"/>
  <g fill="url(#cells)">
    <rect x="8" y="16" width="7" height="16" rx="2.5"/>
    <rect x="18" y="16" width="7" height="16" rx="2.5"/>
    <rect x="28" y="16" width="7" height="16" rx="2.5"/>
  </g>
</svg>
